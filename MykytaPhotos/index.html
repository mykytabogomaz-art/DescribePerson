
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкала віку</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap');
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #faf8f5; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: flex-start; 
            margin: 0;
            padding: 1rem;
        }

        .range-wrapper {
            position: relative;
            height: 20px;
            width: 100%;
        }

        .track-bg {
            position: absolute;
            left: 10px; 
            right: 10px;
            top: 7px; 
            height: 6px;
            background-color: #e8e4db;
            border-radius: 3px;
        }

        .track-fill {
            position: absolute;
            height: 100%;
            background-color: #a3c2b5;
            border-radius: 3px;
        }

        .scale-container {
            position: absolute;
            left: 0; 
            right: 0;
            top: 0;
            display: flex;
            justify-content: space-between;
            pointer-events: none; 
        }

        .scale-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 20px;
        }

        .dot-placeholder {
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scale-tick {
            width: 2px;
            height: 8px;
            background-color: #b5beb9;
            border-radius: 1px;
            margin-top: 10px; 
        }

        .scale-label {
            margin-top: 10px;
            writing-mode: vertical-rl; 
            font-size: 12px;
            font-weight: 700;
            color: #8c8172;
        }

        input[type=range] {
            position: absolute;
            width: 100%;
            height: 20px;
            top: 0;
            margin: 0;
            appearance: none;
            background: transparent;
            pointer-events: none;
            outline: none;
            z-index: 10;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            pointer-events: all;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border: 3px solid #a3c2b5;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        input[type=range]::-moz-range-thumb {
            pointer-events: all;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border: 3px solid #a3c2b5;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="p-2 md:p-6">

    <!-- Екран гри -->
    <div id="game-screen" class="w-full max-w-3xl bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 mt-0 relative block">
        
        <!-- Нумерація питань (Формат: 1/15) -->
        <div id="question-counter" class="absolute top-4 left-6 text-sm md:text-base font-bold text-[#b5beb9]">
            1/15
        </div>

        <h1 class="text-2xl md:text-3xl font-extrabold text-[#7a6f61] text-center mb-4 mt-2">Скільки тобі тут?</h1>

        <div class="relative w-full h-[297px] bg-[#ebe6df] rounded-xl overflow-hidden shadow-inner flex justify-center items-center">
            <img id="photo-image" src="" alt="Фото" class="max-w-full max-h-full object-contain transition-opacity duration-300 opacity-0" onload="this.classList.remove('opacity-0')">
            
            <div id="photo-year-badge" class="absolute top-3 right-3 bg-white/85 backdrop-blur-sm px-3 py-1.5 rounded-lg text-xl font-extrabold text-[#7a6f61] shadow-sm border border-white/50">
                20??
            </div>
        </div>

        <div class="range-wrapper mt-4 mb-20" id="slider-widget">
            <div class="track-bg">
                <div class="track-fill" id="track-fill"></div>
            </div>

            <div class="scale-container" id="scale-container"></div>

            <input type="range" id="slider-1" min="2007" max="2026">
            <input type="range" id="slider-2" min="2007" max="2026">
        </div>

        <div class="bg-[#f6f2ec] rounded-2xl p-4 md:p-5 text-center border border-[#e8e0d5]">
            <p class="text-lg md:text-xl font-bold text-[#7a6f61] flex items-center justify-center flex-wrap gap-2 md:gap-3">
                У 
                <input type="text" id="year-input" inputmode="numeric" value="" class="w-16 md:w-20 h-10 md:h-12 text-center rounded-xl border border-gray-300 text-lg md:text-xl font-bold outline-none focus:border-[#a3c2b5] shadow-inner text-[#7a6f61]">
                році мені було 
                <input type="text" id="age-input" inputmode="numeric" value="" class="w-14 md:w-16 h-10 md:h-12 text-center rounded-xl border border-gray-300 text-lg md:text-xl font-bold outline-none focus:border-[#a3c2b5] shadow-inner text-[#7a6f61]"> 
                
                <!-- Вибір слова (без знаку питання) -->
                <select id="word-select" class="h-10 md:h-12 text-center rounded-xl border border-gray-300 text-lg md:text-xl font-bold outline-none focus:border-[#a3c2b5] shadow-inner text-[#7a6f61] bg-white cursor-pointer px-2">
                    <option value="" disabled selected></option>
                    <option value="рік">рік</option>
                    <option value="роки">роки</option>
                    <option value="років">років</option>
                </select>.
            </p>
        </div>

        <div class="mt-6 flex justify-center">
            <button onclick="nextQuestion()" class="bg-[#a3c2b5] text-white font-extrabold text-lg px-10 py-3 rounded-xl shadow-md hover:bg-[#8eb0a3] transition-colors active:scale-95 tracking-wide">
                Наступне питання
            </button>
        </div>
    </div>

    <!-- Екран результатів -->
    <div id="result-screen" class="w-full max-w-3xl bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-gray-100 mt-0 text-center hidden">
        <h1 class="text-4xl md:text-5xl font-extrabold text-[#7a6f61] mb-6">Молодець! 🎉</h1>
        
        <!-- Колаж з усіх 15 фото -->
        <div id="collage-container" class="grid grid-cols-3 md:grid-cols-5 gap-2 md:gap-3 mb-8">
            <!-- Сюди через JS додадуться мініатюри фотографій -->
        </div>

        <button onclick="startGame()" class="bg-[#a3c2b5] text-white font-extrabold text-xl px-12 py-4 rounded-xl shadow-md hover:bg-[#8eb0a3] transition-colors active:scale-95 tracking-wide">
            Грати знову
        </button>
    </div>

    <script src="photos.js"></script>

    <script>
        const minYear = 2007;
        const maxYear = 2026;
        const TOTAL_QUESTIONS = 15;
        
        const scaleContainer = document.getElementById('scale-container');
        const slider1 = document.getElementById('slider-1');
        const slider2 = document.getElementById('slider-2');
        const trackFill = document.getElementById('track-fill');
        const yearInput = document.getElementById('year-input');
        const ageInput = document.getElementById('age-input');
        const wordSelect = document.getElementById('word-select');
        
        const photoEl = document.getElementById('photo-image');
        const yearBadgeEl = document.getElementById('photo-year-badge');
        const counterEl = document.getElementById('question-counter');
        
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const collageContainer = document.getElementById('collage-container');

        let allPhotos = [];
        let usedPhotosInSession = [];
        let currentPhotoIndex = 0;
        let currentQuestionNumber = 1;

        // Генерація шкали
        for (let year = minYear; year <= maxYear; year++) {
            const column = document.createElement('div');
            column.className = 'scale-column';
            column.innerHTML = `
                <div class="dot-placeholder"><div class="scale-tick"></div></div>
                <div class="scale-label">${year}</div>
            `;
            scaleContainer.appendChild(column);
        }

        function updateSlider() {
            let val1 = parseInt(slider1.value);
            let val2 = parseInt(slider2.value);
            if (val1 > val2) {
                let tmp = val1; val1 = val2; val2 = tmp;
            }
            const percent1 = ((val1 - minYear) / (maxYear - minYear)) * 100;
            const percent2 = ((val2 - minYear) / (maxYear - minYear)) * 100;
            trackFill.style.left = percent1 + '%';
            trackFill.style.right = (100 - percent2) + '%';
        }

        function startGame() {
            if (typeof window.fileNames !== 'undefined' && window.fileNames.length > 0) {
                allPhotos = window.fileNames.sort(() => Math.random() - 0.5);
            } else {
                console.warn("Файл photos.js порожній.");
                allPhotos = ["2010_1.jpg"];
            }

            currentPhotoIndex = 0;
            currentQuestionNumber = 1;
            usedPhotosInSession = [];
            
            gameScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            collageContainer.innerHTML = '';
            
            loadNextPhoto();
        }

        function nextQuestion() {
            if (currentQuestionNumber >= TOTAL_QUESTIONS) {
                showResults();
                return;
            }
            currentQuestionNumber++;
            loadNextPhoto();
        }

        function loadNextPhoto() {
            if (currentPhotoIndex >= allPhotos.length) {
                currentPhotoIndex = 0; 
                allPhotos = allPhotos.sort(() => Math.random() - 0.5);
            }

            const filename = allPhotos[currentPhotoIndex];
            usedPhotosInSession.push(filename);
            currentPhotoIndex++;

            counterEl.innerText = `${currentQuestionNumber}/${TOTAL_QUESTIONS}`;

            photoEl.classList.add('opacity-0');
            setTimeout(() => {
                photoEl.src = 'images/' + filename;
            }, 150);
            
            const yearMatch = filename.match(/\d{4}/);
            yearBadgeEl.innerText = yearMatch ? yearMatch[0] : "20??";

            slider1.value = minYear;
            slider2.value = maxYear;
            yearInput.value = '';
            ageInput.value = '';
            wordSelect.value = ''; 
            
            updateSlider();
        }

        function showResults() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            usedPhotosInSession.forEach(filename => {
                const img = document.createElement('img');
                img.src = 'images/' + filename;
                img.className = 'w-full aspect-square object-cover rounded-lg shadow-sm';
                collageContainer.appendChild(img);
            });
        }

        slider1.addEventListener('input', updateSlider);
        slider2.addEventListener('input', updateSlider);
        
        window.onload = startGame;
    </script>
</body>
</html>
