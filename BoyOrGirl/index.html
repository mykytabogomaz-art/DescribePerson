<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Хлопчик чи Дівчинка?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f5f0ea; /* Спокійний бежевий фон */
            color: #5c5346;
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Компактно, на одному екрані */
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            transition: background-color 0.3s ease;
        }

        .photo-container {
            position: relative;
            width: 100%;
            max-width: 560px; /* Фото збільшено у 2 рази */
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background-color: #eae1d5;
            overflow: hidden;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8rem;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: scale(0.5);
            pointer-events: none;
        }

        .feedback-overlay.show {
            opacity: 1;
            transform: scale(1);
        }

        .btn {
            transition: transform 0.1s ease, filter 0.2s ease;
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .bg-soft-blue { background-color: #b3cde0; }
        .bg-soft-pink { background-color: #f4b6c2; }
    </style>
</head>
<body id="app-body">

    <!-- Головний екран гри -->
    <div id="game-screen" class="flex-1 flex flex-col items-center justify-center p-4 max-w-2xl mx-auto w-full relative">
        
        <!-- Лічильник -->
        <div id="question-counter" class="text-lg md:text-xl font-bold mb-2 text-[#8c8172]">
            Питання 1 з 15
        </div>

        <h1 class="text-3xl md:text-4xl font-extrabold mb-4 text-center">Хто на фото?</h1>

        <!-- Блок з фотографією -->
        <div class="photo-container mb-6">
            <img id="child-photo" src="" alt="Фото" style="opacity: 0;">
            <div id="feedback" class="feedback-overlay"></div>
        </div>

        <!-- Кнопки вибору -->
        <div class="flex gap-4 w-full justify-center max-w-[560px]">
            <button onclick="checkAnswer('girl')" class="btn bg-soft-pink text-white flex-1 py-4 md:py-6 rounded-2xl text-2xl font-bold shadow-sm flex flex-col items-center gap-2">
                <span class="text-4xl">👧</span>
                Дівчинка
            </button>
            <button onclick="checkAnswer('boy')" class="btn bg-soft-blue text-white flex-1 py-4 md:py-6 rounded-2xl text-2xl font-bold shadow-sm flex flex-col items-center gap-2">
                <span class="text-4xl">👦</span>
                Хлопчик
            </button>
        </div>
    </div>

    <!-- Фінальний екран з результатами -->
    <div id="result-screen" class="flex-1 flex flex-col items-center justify-center p-6 text-center hidden">
        <div class="text-6xl mb-4">🏆</div>
        <h1 class="text-4xl font-extrabold mb-4">Гру завершено!</h1>
        <p class="mb-8 text-2xl">Твій результат: <br><span id="score-display" class="text-5xl font-extrabold text-[#8c8172] block mt-4">0 / 15</span></p>
        
        <button onclick="startGame()" class="btn bg-[#d4c5b0] text-white px-10 py-5 rounded-2xl text-2xl font-bold shadow-sm">
            🔄 Грати знову
        </button>
    </div>

    <!-- 1. Завантажуємо файл зі списком фотографій -->
    <script src="photos.js"></script>

    <!-- 2. Логіка гри -->
    <script>
        const TOTAL_QUESTIONS = 15;
        let currentQuestion = 0;
        let score = 0;
        let currentPhoto = null;
        let isWaiting = false;
        let usedPhotos = []; 
        let allPhotos = [];

        const bodyEl = document.getElementById('app-body');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const photoEl = document.getElementById('child-photo');
        const feedbackEl = document.getElementById('feedback');
        const counterEl = document.getElementById('question-counter');
        const scoreDisplay = document.getElementById('score-display');

        function initPhotos() {
            // Перевіряємо, чи успішно завантажився список з photos.js
            if (typeof window.fileNames === 'undefined') {
                alert("Не знайдено список фотографій! Перевірте файл photos.js");
                return [];
            }
            
            return window.fileNames.map(filename => {
                const parts = filename.split('_');
                return {
                    url: 'images/' + filename,
                    type: parts[1] === '0' ? 'boy' : 'girl'
                };
            });
        }

        function startGame() {
            allPhotos = initPhotos();
            if (allPhotos.length === 0) return;

            currentQuestion = 0;
            score = 0;
            usedPhotos = [];
            
            gameScreen.classList.remove('hidden');
            resultScreen.classList.add('hidden');
            
            loadNextPhoto();
        }

        function loadNextPhoto() {
            if (currentQuestion >= TOTAL_QUESTIONS) {
                showResults();
                return;
            }

            isWaiting = true;
            photoEl.style.opacity = '0';
            
            setTimeout(() => {
                // Відфільтровуємо фото, щоб вони не повторювалися в межах однієї гри
                let availablePhotos = allPhotos.filter(p => !usedPhotos.includes(p.url));
                
                // Якщо унікальні фото закінчилися, скидаємо пам'ять
                if (availablePhotos.length === 0) {
                    usedPhotos = [];
                    availablePhotos = allPhotos;
                }

                const randomIndex = Math.floor(Math.random() * availablePhotos.length);
                currentPhoto = availablePhotos[randomIndex];
                usedPhotos.push(currentPhoto.url);
                
                currentQuestion++;
                counterEl.innerText = `Питання ${currentQuestion} з ${TOTAL_QUESTIONS}`;
                
                photoEl.src = currentPhoto.url;
                
                photoEl.onload = () => {
                    photoEl.style.opacity = '1';
                    isWaiting = false;
                    feedbackEl.className = 'feedback-overlay';
                    feedbackEl.innerHTML = '';
                    bodyEl.style.backgroundColor = '#f5f0ea'; 
                };
            }, 300);
        }

        function checkAnswer(answer) {
            if (isWaiting) return;
            isWaiting = true;

            const isCorrect = (answer === currentPhoto.type);
            
            if (isCorrect) {
                score++;
                feedbackEl.innerHTML = '✅';
                bodyEl.style.backgroundColor = '#e2ebd8'; // Спокійний зелений
            } else {
                feedbackEl.innerHTML = '❌';
                bodyEl.style.backgroundColor = '#fae3e3'; // Спокійний червоний
            }
            
            feedbackEl.classList.add('show');

            setTimeout(() => {
                loadNextPhoto();
            }, 1200);
        }

        function showResults() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            bodyEl.style.backgroundColor = '#f5f0ea';
            scoreDisplay.innerText = `${score} / ${TOTAL_QUESTIONS}`;
        }

        // Запуск
        window.onload = startGame;
    </script>
</body>
</html>
